name: Telink OpenThread libraries builder

on:
  pull_request:
  workflow_dispatch:

jobs:
  telink_ot_lib_build:
    runs-on: ubuntu-latest
    name: Telink OpenThread libraries builder
    env:
      ZEPHYR_COMPILER_VERSION: 0.17.0
      ANDES_COMPILER_VERSION: 14.2.0
      BUILD_SOC: tl7218x
      SAMPLE_SRC_PATH: "samples/net/openthread/lib_builder"
    steps:

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends libdigest-sha-perl cmake python3 ninja-build

    - name: Setup Zephyr toolchain
      run: |
        mkdir ~/zephyr_gcc
        wget -q -P ~/zephyr_gcc https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v"${ZEPHYR_COMPILER_VERSION}"/zephyr-sdk-"${ZEPHYR_COMPILER_VERSION}"_linux-x86_64.tar.xz
        (cd ~/zephyr_gcc && wget -O - https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v"${ZEPHYR_COMPILER_VERSION}"/sha256.sum | shasum --check --ignore-missing)
        tar xf ~/zephyr_gcc/zephyr-sdk-"${ZEPHYR_COMPILER_VERSION}"_linux-x86_64.tar.xz -C ~/zephyr_gcc
        (cd ~/zephyr_gcc/zephyr-sdk-"${ZEPHYR_COMPILER_VERSION}" && ./setup.sh -t riscv64-zephyr-elf -c)
        rm -rf ~/zephyr_gcc/zephyr-sdk-"${ZEPHYR_COMPILER_VERSION}"_linux-x86_64.tar.xz

    - name: Setup Andes toolchain
      run: |
        mkdir ~/nds-gcc
        wget -q -P ~/nds-gcc https://doc.telink-semi.cn/Zephyr/binaries/public/tools/nds32le-elf-newlib-v5f_"${ANDES_COMPILER_VERSION}".txz
        tar xf ~/nds-gcc/nds32le-elf-newlib-v5f_"${ANDES_COMPILER_VERSION}".txz -C ~/nds-gcc
        rm -rf ~/nds-gcc/nds32le-elf-newlib-v5f_"${ANDES_COMPILER_VERSION}".txz

    - name: Checkout Zephyr
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: West setup
      run: |
        pip install west
        cd ..
        west init -l zephyr
        west update
        west blobs fetch hal_telink
        west blobs list hal_telink -f '{status} {path}' | grep '^M lib_zephyr_b91.a$' && exit 1
        west zephyr-export
        pip install -r zephyr/scripts/requirements.txt

    - name: Prepare build
      run: |
        mkdir -p build_telink_ot_lib_artifacts/include
        mkdir -p build_telink_ot_lib_artifacts/lib
        mkdir -p build_telink_ot_lib_artifacts/zephyr

    - name: Build libraries with Zephyr compiler
      run: |
        for build_config in "$SAMPLE_SRC_PATH"/overlays/*.conf
        do
          config="${build_config#"$SAMPLE_SRC_PATH"/}"
          echo "build configuration: $config"
          rm -rf build_tmp
          west build -b "$BUILD_SOC" -d build_tmp "$SAMPLE_SRC_PATH" -- \
                     -DOVERLAY_CONFIG="$config" \
                     -DCONFIG_COMPILER_WARNINGS_AS_ERRORS=y
          libname="libopenthread-zephyr-${config##*/}"
          libname="${libname%.conf}.a"
          cp build_tmp/zephyr/libopenthread.a \
             "build_telink_ot_lib_artifacts/lib/$libname"
        done

    - name: Build libraries with Andes compiler
      run: |
        export ZEPHYR_TOOLCHAIN_VARIANT="andes-gcc"
        export ANDES_GCC_PATH="~/nds-gcc/nds32le-elf-newlib-v5f"
        for build_config in "$SAMPLE_SRC_PATH"/overlays/*.conf
        do
          config="${build_config#"$SAMPLE_SRC_PATH"/}"
          echo "build configuration: $config"
          rm -rf build_tmp
          west build -b "$BUILD_SOC" -d build_tmp "$SAMPLE_SRC_PATH" -- \
                     -DOVERLAY_CONFIG="$config" \
                     -DCONFIG_COMPILER_WARNINGS_AS_ERRORS=y
          libname="libopenthread-andes-${config##*/}"
          libname="${libname%.conf}.a"
          cp build_tmp/zephyr/libopenthread.a \
             "build_telink_ot_lib_artifacts/lib/$libname"
        done
        unset ZEPHYR_TOOLCHAIN_VARIANT
        unset ANDES_GCC_PATH

    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      with:
        path: |
          build_telink_ot_lib_artifacts/*
