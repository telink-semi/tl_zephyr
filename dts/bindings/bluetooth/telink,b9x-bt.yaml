description: Telink B9x Bluetooth HCI node

compatible: "telink,b9x-bt"

include: bt-hci.yaml

properties:
  bt-hci-name:
    default: "HCI Controller"
  bt-hci-bus:
    default: "virtual"
  bt-hci-quirks:
    default: ["no-auto-dle"]
