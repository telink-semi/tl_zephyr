# tlkdbg owns the board UART; the console/log subsystem must be off.
CONFIG_TLKDBG=y
CONFIG_TLKDBG_UART_BAUD=3000000
CONFIG_TLKDBG_UART_INSTANCE=0
CONFIG_TLKDBG_UART_DMA_CH=7
CONFIG_TLKDBG_POLL_THREAD=y
CONFIG_TLKDBG_LABEL_TABLE=y
CONFIG_TLKDBG_LABEL_ROOTS="."

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_SERIAL=n
CONFIG_UART_TELINK_TLX=n
CONFIG_UART_INTERRUPT_DRIVEN=n
