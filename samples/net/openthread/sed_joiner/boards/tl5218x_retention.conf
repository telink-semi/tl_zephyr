# Telink 802.15.4 RF optimization
CONFIG_IEEE802154_TL521X_OPTIMIZATION=y

# required by the optimization path (tl521x_wfi_direct -> irq_connect_dynamic)
CONFIG_DYNAMIC_INTERRUPTS=y

# Place the SED standby path (data poll, MAC, radio sleep/receive/transmit)
# in retention RAM instead of flash
CONFIG_OPENTHREAD_SED_RAM_CODE=y
