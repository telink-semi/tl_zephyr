# enable openthread
CONFIG_NET_L2_OPENTHREAD=y
# required openthread version
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
# Telink platform required (more than 1mS due to architecture, lower better)
CONFIG_OPENTHREAD_CSL_RECEIVE_TIME_AHEAD=2000
CONFIG_OPENTHREAD_CSL_REQUEST_TIME_AHEAD=2000
