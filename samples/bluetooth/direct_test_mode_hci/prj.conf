# IO - Enable console on UART0 for debug logs
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Enable N22 core support (shared memory + mailbox communication)
# This triggers soc_tlx_mcc_init() which calls mcc_d25f_service_init()
# to set up mailbox IRQ and shared memory FIFOs during SYS_INIT.
CONFIG_TELINK_TL322X_ENABLE_N22=y

# BT TLX driver - required to compile MCC shared memory sources
# (service_d25f.c, mcc.c, etc. are built under CONFIG_BT_TLX).
# We do NOT call bt_enable_raw(), so no controller thread starts.
CONFIG_BT=y
CONFIG_BT_TLX=y

# Buffer sizes for HCI packets (up to 260 bytes for ACL)
CONFIG_NET_BUF=y
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255

# Logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Enable debug logging for HCI UART transport
CONFIG_DTM_HCI_UART_TRANSPORT_LOG_LEVEL_DBG=y
