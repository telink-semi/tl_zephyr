CONFIG_BT=y
CONFIG_BT_SMP=y
# Match Telink demo: Unauthenticated_Pairing_with_Encryption
# = LE Security Mode 1 Level 2, Just Works, no MITM
# Disable SC-pairing-only (default y) to allow legacy pairing with encryption
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_PERIPHERAL=y

# Bonding: persist pairing keys in flash so reconnects skip re-pairing
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_TLX_CHANNEL_SOUNDING=y

CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_BUF_EVT_RX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=7
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_ATT_TX_COUNT=7

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=4096
CONFIG_TL_BLE_CTRL_THREAD_STACK_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_TL_BLE_CTRL_RF_POWER=9
# CONFIG_TL_BLE_PUBLIC_MAC_ADDR="11:aa:aa:aa:aa:aa"
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_OUTPUT_DISASSEMBLY=y
