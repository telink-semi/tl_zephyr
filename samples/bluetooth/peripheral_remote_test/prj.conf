# Increased stack due to settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="periphr_demo"
CONFIG_BT_DEVICE_APPEARANCE=384

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Allow overwriting an existing unauthenticated bond (e.g. when Central
# deletes its bond and re-pairs with JUST_WORKS).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# Auto-unpair matching bonds on other local identities when a new bond completes.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
# Store multiple bonds (default is 1).
CONFIG_BT_MAX_PAIRED=5

CONFIG_GPIO=y
CONFIG_RISCV_VECTORED_MODE=n
